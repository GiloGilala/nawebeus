# CI — the quality gate required by NWB-P0-003.
#
# Deliberately narrow: typecheck, lint, build, and the full test suite against a real
# PostgreSQL. The planning docs (Engineering Standards §9.5, QA Strategy §11.1)
# describe a much larger pipeline; almost none of that tooling exists in this repo
# yet. What is excluded, and why, is listed in `.scratch/p0-foundation-gap/issues/
# 03-ci-pipeline.md` — read that before adding stages here.
#
# If you are here to add coverage gating: do NOT add `coverageThreshold` to
# bunfig.toml. On Bun 1.4 that option is per-file, prints no failure message, is only
# enforced when the `text` reporter is enabled, cannot tolerate a 0%-coverage file at
# any threshold, and silently accepts keys it does not recognise — so the config the
# docs propose (`{ services = 85, lib = 90 }`) is a permanent green no-op. Enforce
# coverage from a script over `coverage/lcov.info` instead. Verified findings and the
# recommended pattern are in the ticket.

name: CI

on:
  push:
    branches: [main, "feature/**", "bugfix/**", "hotfix/**"]
  pull_request:
    branches: [main]

# A new push to the same ref makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # WAT — the project's canonical timezone (docs/technical/Infrastructure.md). Set so
  # timestamp-sensitive tests do not depend on the runner's locale.
  TZ: Africa/Lagos

jobs:
  # ── Stage 1: static checks. Fast, no database, fails the run early. ───────────
  quality:
    name: Typecheck, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned to the version the lockfile was generated with. Do not float
          # this — a Bun upgrade that rewrites bun.lock should be a deliberate,
          # reviewed commit, not something CI discovers.
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      # `bun run lint` runs `biome check .` — formatting, linting, and import order
      # in one pass. This step was wired as a labelled placeholder in NWB-P0-003
      # precisely so that NWB-P0-004 would only have to change package.json, which is
      # what happened. It exits non-zero on **errors only**; warnings do not fail the
      # build. That distinction is load-bearing: `noExplicitAny` is deliberately a
      # warning rather than an error because the codebase has 248 `any` sites. See
      # the ticket before promoting any of them.
      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

  # ── Stage 2: the suite, against a real database. ─────────────────────────────
  test:
    name: Test (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality

    services:
      postgres:
        # ADR-003 sets PostgreSQL 14+ as the floor. CI tests the floor deliberately:
        # if the schema ever starts relying on a newer-only construct, that should
        # fail here rather than on the production VPS.
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nawebeus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nawebeus_test
      # Required by loadConfig() on every boot. Throwaway values — they sign tokens
      # for an ephemeral database that is destroyed with the runner.
      JWT_ACCESS_SECRET: ci-access-secret-0123456789abcdef
      JWT_REFRESH_SECRET: ci-refresh-secret-0123456789abcdef

    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # DATABASE_URL is the single source of truth for the connection (NWB-P0-009);
      # the DB_* variables are gone. `--force` suppresses the prompt that
      # `strict: true` raises even on a fresh database — without it, and with no
      # TTY, drizzle-kit aborts silently while exiting 0, which would leave this
      # step "green" with zero tables pushed.
      #
      # This works only because the service container starts empty. The step is
      # not a migration history — NWB-P0-005 must eventually replace it with
      # `db:migrate`.
      - name: Push schema
        run: bun run db:push -- --force

      # The suite depends on seeded permissions and roles. Without them the RBAC and
      # signin suites fail — 7 tests. Verified by running the suite against an
      # unseeded database.
      - name: Seed permissions, roles, and bootstrap admin
        run: bun run seed

      - name: Test
        run: bun test
